[[IgnoredVulns]]
id = "GHSA-xjj6-f33q-929c"
ignoreUntil = 2026-10-31T00:00:00Z
reason = "High severity (CVSS 3.1 7.5): denial of service through excessive content encodings in undici 8.11.2 reached only through jsdom 30.1.2, the DOM of the Vitest unit tests, a development dependency; jsdom uses that package only for its own resource loading, XHR and WebSocket, and the unit tests load no external resources and open no XHR, WebSocket or EventSource through jsdom (fetch in tests is Node's built-in one, which the unit tests do not call), and nothing in the application build imports undici. The fix 8.12.2 was published 2026-10-15; the next dependency change upgrades it under ADR-0017 and removes the matching auditConfig.ignoreGhsas entry by hand. Triage: knowledge/research/frontend-toolchain-2026-10-21.md"

