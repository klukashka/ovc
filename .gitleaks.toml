[extend]
useDefault = true

[[allowlists]]
description = "Start-up refusal tests name the unsubscribe signing secret variable beside values generated per run, never a real secret"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^backend/cmd/internal/startup/settings_process_test\.go$''']
regexTarget = "secret"
regexes = ['''^OVC_UNSUBSCRIBE_SIGNING_SECRET=$''']
