<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переработка интерфейса · OVC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F4EE; --surface: #FBF9F4; --field: #FFFFFF; --sidebar: #F1EEE6; --hover: #E7E3D9;
  --border: #E2DCD0; --border-strong: #8F8676; --text: #26241F; --muted: #6B655A; --icon: #736C60;
  --accent: #5E6B3A; --accent-hover: #525E32; --on-accent: #FFFFFF; --accent-text: #4A5530;
  --success: #2E6B4F; --warning: #8A5A12; --danger: #A3352A; --info: #3F5E7A; --live: #A3352A;
  --mine: #E6EAD8; --scrim: rgba(38,36,31,.32); --shadow: 0 8px 24px rgba(38,36,31,.12);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1C1B18; --surface: #23221E; --field: #2A2925; --sidebar: #201F1C; --hover: #2E2D28;
  --border: #37352F; --border-strong: #7D7667; --text: #ECE8DF; --muted: #ABA496; --icon: #9C9587;
  --accent: #A3B275; --accent-hover: #B2C083; --on-accent: #1C1B18; --accent-text: #B7C48C;
  --success: #86C3A4; --warning: #D9A75E; --danger: #E58A7C; --info: #93B3D1; --live: #E58A7C;
  --mine: #343A26; --scrim: rgba(0,0,0,.5); --shadow: 0 0 0 1px #7D7667;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/22px "Golos Text", system-ui, sans-serif; }
a { color: var(--accent-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.serif { font-family: "Literata", Georgia, serif; font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: 14px; line-height: 20px; }
.label { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.tnum { font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--sidebar); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
.side .me { display: flex; gap: 10px; align-items: center; padding: 4px 8px 14px; font-weight: 500; }
.side a.item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 14px; min-height: 32px; }
.side a.item:hover { background: var(--hover); }
.side a.item[aria-current="page"] { background: var(--hover); font-weight: 500; }
.side .count { font-size: 12px; color: var(--muted); }
.side .foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.side .foot .seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--hover); border-radius: 6px; padding: 2px; }
.side .foot .seg2 button { border: 0; background: transparent; border-radius: 5px; padding: 4px; cursor: pointer; color: var(--muted); }
.side .foot .seg2 button[aria-pressed="true"] { background: var(--field); color: var(--text); }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; flex: 0 0 auto; }
main { min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; padding: 40px 56px 72px; display: flex; flex-direction: column; gap: 32px; }
.page.reading { max-width: 832px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 28px; line-height: 36px; margin: 0; }
.page-head h1.display { font-size: 36px; line-height: 44px; }
.back { font-size: 14px; display: inline-block; margin-bottom: 4px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sec-head h2 { margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-strong); background: transparent; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }
.btn.text { border-color: transparent; color: var(--accent-text); padding-inline: 8px; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 14px; }
.btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.list { border-top: 1px solid var(--border); }
.row { display: grid; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--border); }
.panel { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 64px; align-items: start; }
.prose { max-width: 68ch; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .flabel { font-size: 14px; font-weight: 500; }
.field .opt { color: var(--muted); font-weight: 400; }
.field .hint { font-size: 13px; line-height: 18px; color: var(--muted); }
.input, textarea.input, select.input { border: 1px solid var(--border-strong); background: var(--field); border-radius: 8px; padding: 9px 12px; min-height: 40px; width: 100%; }
textarea.input { min-height: 96px; resize: vertical; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 14px; display: flex; gap: 6px; }
.group3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.summary { border: 2px solid var(--danger); border-radius: 10px; padding: 16px 20px; background: var(--surface); }
.summary h2 { margin: 0 0 8px; font-size: 18px; line-height: 26px; font-weight: 500; }
.summary ul { margin: 0; padding-left: 18px; }
.summary a { color: var(--danger); }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--hover); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { border: 0; border-radius: 6px; padding: 8px 14px; background: transparent; cursor: pointer; color: var(--muted); font-weight: 500; text-align: left; }
.seg button small { display: block; font-weight: 400; font-size: 12px; line-height: 16px; }
.seg button[aria-pressed="true"] { background: var(--field); color: var(--text); box-shadow: 0 1px 2px rgba(38,36,31,.12); }
.drop { border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.thumb { width: 96px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; }
.thumb .ph { aspect-ratio: 4/3; border-radius: 8px; background: linear-gradient(135deg, #C9BFA8, #9C9077); position: relative; }
.thumb .ph.b2 { background: linear-gradient(135deg, #B8C2A0, #7E8C5C); }
.thumb .ph.pdf { background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.thumb .rm { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 12px; }
.warn { border-left: 3px solid var(--warning); background: var(--surface); padding: 10px 14px; border-radius: 4px; font-size: 14px; }
.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; background: var(--surface); }
.state { font-size: 14px; }
.empty { padding: 28px 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.empty h3 { margin: 0; font-size: 18px; font-weight: 500; }
.kebab { width: 32px; height: 32px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; color: var(--icon); font-size: 18px; }
.kebab:hover { background: var(--hover); }
.msgs-wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }
.chans { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.chans .search { margin: 14px; }
.chan { display: flex; gap: 10px; padding: 10px 14px; border: 0; border-top: 1px solid var(--border); background: transparent; text-align: left; width: 100%; cursor: pointer; align-items: center; }
.chan:hover { background: var(--hover); }
.chan[aria-current="true"] { background: var(--hover); }
.chan .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chan .who b { font-weight: 500; font-size: 14px; }
.chan .who span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chan .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 12px; color: var(--muted); }
.cnt { background: var(--accent); color: var(--on-accent); border-radius: 9px; padding: 0 6px; font-size: 11px; line-height: 17px; font-weight: 600; }
.conv { display: flex; flex-direction: column; min-height: 0; position: relative; }
.conv-head { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); }
.conv-head .who { flex: 1; display: flex; flex-direction: column; }
.conv-head h1 { font-size: 16px; line-height: 22px; margin: 0; font-weight: 500; font-family: inherit; }
.conv-head .online { font-size: 13px; color: var(--success); }
.pinbar { display: flex; gap: 10px; align-items: center; padding: 8px 18px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 14px; }
.pinbar i { width: 2px; align-self: stretch; background: var(--accent); }
.pinbar div { flex: 1; min-width: 0; }
.pinbar small { display: block; color: var(--accent-text); font-weight: 600; font-size: 12px; }
.pinbar span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.searchbar { display: flex; gap: 8px; align-items: center; padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--surface); }
.history { flex: 1; overflow: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 4px; }
.chip { align-self: center; font-size: 12px; background: var(--hover); color: var(--muted); padding: 2px 10px; border-radius: 10px; margin: 8px 0; }
.msg { display: flex; align-items: flex-end; gap: 6px; max-width: 72%; position: relative; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.bubble { padding: 7px 12px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; line-height: 20px; min-width: 0; }
.msg.me .bubble { background: var(--mine); border-color: transparent; }
.msg.hit .bubble { outline: 2px solid var(--warning); }
.bmeta { float: right; margin: 6px 0 -4px 12px; font-size: 11px; line-height: 14px; color: var(--muted); }
.ticks { color: var(--accent-text); font-weight: 600; letter-spacing: -3px; margin-left: 3px; }
.quote { display: block; border-left: 2px solid var(--accent); padding: 1px 0 1px 8px; margin: 2px 0 6px; font-size: 13px; line-height: 17px; cursor: pointer; background: transparent; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; color: inherit; width: 100%; }
.quote b { display: block; color: var(--accent-text); font-weight: 600; }
.quote span { color: var(--muted); }
.album { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin: -2px -7px 6px; border-radius: 10px; overflow: hidden; width: 300px; max-width: 100%; }
.album span { aspect-ratio: 1; background: linear-gradient(135deg, #C9BFA8, #9C9077); }
.album span:nth-child(2) { background: linear-gradient(135deg, #B8C2A0, #7E8C5C); }
.album span.wide { grid-column: 1 / 3; aspect-ratio: 2 / 1; background: linear-gradient(160deg, #D6CBB4, #A89778); }
.file { display: flex; gap: 10px; align-items: center; margin: 2px 0 4px; }
.file .fi { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 10px; font-weight: 600; }
.reacts { display: flex; gap: 4px; margin-top: 4px; }
.reacts button { font-size: 12px; border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 0 7px; cursor: pointer; }
.reacts button[aria-pressed="true"] { border-color: var(--accent); }
.more { opacity: 0; border: 0; background: var(--bg); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; color: var(--icon); }
.msg:hover .more, .msg:focus-within .more { opacity: 1; }
.menu { position: absolute; bottom: 30px; z-index: 5; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; display: flex; flex-direction: column; min-width: 180px; }
.msg .menu { right: 0; }
.msg.me .menu { right: auto; left: 0; }
.menu button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--hover); }
.menu .rx { display: flex; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.menu .rx button { padding: 4px 6px; font-size: 16px; }
.jump { position: absolute; right: 22px; bottom: 84px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); cursor: pointer; color: var(--icon); }
.jump em { position: absolute; top: -6px; right: -4px; font-style: normal; font-size: 11px; line-height: 16px; background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 0 5px; font-weight: 600; }
.replybar { display: flex; gap: 10px; align-items: center; padding: 8px 18px; border-top: 1px solid var(--border); background: var(--surface); font-size: 13px; }
.replybar div { flex: 1; border-left: 2px solid var(--accent); padding-left: 8px; min-width: 0; }
.replybar b { display: block; color: var(--accent-text); }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 18px 14px; border-top: 1px solid var(--border); }
.composer textarea { flex: 1; min-height: 40px; max-height: 160px; resize: none; border-radius: 20px; padding: 9px 16px; border: 1px solid var(--border-strong); background: var(--field); }
.round { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; flex: 0 0 auto; }
.round.send { background: var(--accent); color: var(--on-accent); }
.round.att { background: transparent; color: var(--icon); }
.round.att:hover { background: var(--hover); }
.banner { position: fixed; left: 50%; transform: translateX(-50%); top: 12px; z-index: 50; background: var(--text); color: var(--bg); font-size: 13px; padding: 6px 12px; border-radius: 8px; }
.qrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 140px 32px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.progress { height: 6px; background: var(--hover); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); padding: 24px; max-width: 460px; width: calc(100% - 32px); }
dialog::backdrop { background: var(--scrim); }
dialog h2 { margin: 0 0 8px; font-size: 22px; line-height: 30px; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
@media (max-width: 1023px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
  .side .foot { margin-top: 0; border-top: 0; padding-top: 0; flex-direction: row; }
  .page { padding: 24px 16px 48px; }
  .two, .msgs-wrap { grid-template-columns: minmax(0, 1fr); height: auto; }
  .group3 { grid-template-columns: 1fr; }
  .msg { max-width: 90%; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .chan, .seg button { transition: background .12s; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Разделы" id="side"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="live" class="banner" role="status" hidden></div>
<dialog id="dlg"></dialog>
<script>
(function () {
  const state = {
    role: 'tutor',
    theme: 'light',
    chan: 'anna',
    replyTo: null,
    menuFor: null,
    searchOpen: false,
    searchQ: '',
    jumpCount: 2,
    reactions: { m3: { '👍': 1 } },
    myReaction: {},
    policy: 'after_check',
    policyOpen: false,
    taskErrors: false,
    attached: [{ name: 'text-unit7.jpg', kind: 'img' }, { name: 'questions.pdf', kind: 'pdf' }],
    lessonErrors: false,
    exportState: 'idle',
    exportProgress: 0,
    libNotice: null,
    groupNotice: null,
    removed: false,
    answerFiles: [],
    draftSaved: true,
  };
  const tutorNav = [
    ['today', 'Сегодня', ''], ['schedule', 'Расписание', ''], ['students', 'Ученики', ''], ['group', 'Группы', ''],
    ['library', 'Задания', '3'], ['messages', 'Сообщения', '2'], ['finance', 'Финансы', 'в макете нет'], ['my-data', 'Настройки', '']
  ];
  const studentNav = [
    ['home', 'Главная', ''], ['schedule', 'Расписание', ''], ['work', 'Задание', '1'], ['messages', 'Сообщения', '1'], ['my-data', 'Настройки', '']
  ];
  const chans = [
    { id: 'anna', name: 'Анна Смирнова', color: '#7A6A4F', init: 'АС', last: 'Это к четвергу', time: '18:14', ticks: '✓', unread: 0, online: true },
    { id: 'b2', name: 'Группа B2, вечер', color: '#4F6A7A', init: 'B2', last: 'Илья: а домашку на когда?', time: '17:40', unread: 2 },
    { id: 'pavel', name: 'Павел Лебедев', color: '#7A4F5C', init: 'ПЛ', last: 'Вы: Фото получил, спасибо', time: 'Пн', ticks: '✓✓', unread: 0 },
    { id: 'maria', name: 'Мария Орлова', color: '#6A7A4F', init: 'МО', last: 'Фото', time: '20 нояб.', unread: 0 },
  ];
  const messages = [
    { id: 'm1', me: false, day: 'Сегодня', text: 'Добрый вечер! Я сделала упражнения 4–6, но в шестом не уверена', time: '18:02' },
    { id: 'm2', me: false, album: true, text: 'Вот фото тетради', time: '18:03' },
    { id: 'm3', me: true, quote: 'm1', text: 'Посмотрю до занятия. В шестом проверьте порядок слов во втором предложении', time: '18:10', ticks: '✓✓' },
    { id: 'm4', me: false, text: 'Спасибо!', time: '18:11' },
    { id: 'm5', me: true, file: { name: 'Unit 7, тест.pdf', size: '420 КБ' }, text: 'Это к четвергу', time: '18:14', ticks: '✓' },
  ];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const routes = {};
  const route = () => (location.hash.slice(1) || (state.role === 'tutor' ? 'today' : 'work'));

  function announce(text) {
    const live = document.getElementById('live');
    live.hidden = false;
    live.textContent = '';
    setTimeout(() => { live.textContent = text; }, 30);
    clearTimeout(announce.t);
    announce.t = setTimeout(() => { live.hidden = true; }, 2600);
  }

  function side() {
    const nav = state.role === 'tutor' ? tutorNav : studentNav;
    const cur = route();
    const who = state.role === 'tutor'
      ? '<span class="av" style="background:#5E6B3A">ЕК</span>Елена Котова'
      : '<span class="av" style="background:#7A6A4F">АС</span>Анна Смирнова';
    return '<div class="me">' + who + '</div>' + nav.map(([id, label, count]) =>
      '<a class="item" href="#' + id + '"' + (cur === id || (id === 'library' && ['new-task', 'issue', 'review-empty'].includes(cur)) || (id === 'schedule' && cur === 'new-lesson') ? ' aria-current="page"' : '') + '><span>' + label + '</span>' + (count ? '<span class="count">' + count + '</span>' : '') + '</a>'
    ).join('') +
    '<div class="foot"><span class="muted">Смотреть как</span><div class="seg2" role="group" aria-label="Роль">' +
    '<button type="button" data-act="role" data-v="tutor" aria-pressed="' + (state.role === 'tutor') + '">Преподаватель</button>' +
    '<button type="button" data-act="role" data-v="student" aria-pressed="' + (state.role === 'student') + '">Ученик</button></div>' +
    '<div class="seg2" role="group" aria-label="Тема"><button type="button" data-act="theme" data-v="light" aria-pressed="' + (state.theme === 'light') + '">Светлая</button><button type="button" data-act="theme" data-v="dark" aria-pressed="' + (state.theme === 'dark') + '">Тёмная</button></div>' +
    '<span class="muted">Макет U1a · данные вымышлены</span></div>';
  }

      case 'lib-undo': state.libNotice = null; render(); announce('Перемещение отменено'); break;
      case 'group-remove': state.removed = true; state.groupNotice = true; render(); document.querySelector('.notice button').focus(); break;
      case 'group-addback': state.removed = false; state.groupNotice = null; render(); announce('Илья Козлов снова в группе'); break;
      case 'addanswer': state.answerFiles.push('notebook-' + (state.answerFiles.length + 1) + '.jpg'); render(); break;
      case 'rmanswer': state.answerFiles.splice(Number(v), 1); render(); break;
      case 'submit-work': openDialog('<h2 class="serif">Отправить на проверку?</h2><p class="muted">После отправки ответы нельзя изменить, пока преподаватель не вернёт работу.</p><div class="actions"><button type="button" class="btn primary" data-act="dlg-ok">Отправить</button><button type="button" class="btn text" data-act="dlg-close">Отмена</button></div>'); break;
      case 'export-start': openDialog('<h2 class="serif">Подтвердите паролем</h2><p class="muted small">Архив содержит все ваши данные. Мы также пришлём письмо, что выгрузка запрошена.</p><div class="field"><label for="pw">Текущий пароль</label><input id="pw" class="input" type="password" autocomplete="current-password"></div><div class="actions" style="margin-top:16px"><button type="button" class="btn primary" data-act="export-confirm">Собрать архив</button><button type="button" class="btn text" data-act="dlg-close">Отмена</button></div>'); document.getElementById('pw').focus(); break;
      case 'export-confirm': closeDialog(); state.exportState = 'building'; state.exportProgress = 12; render(); tick(); break;
      case 'export-cancel': state.exportState = 'idle'; state.exportProgress = 0; render(); announce('Архив удалён'); break;
      case 'export-finish': state.exportState = 'ready'; render(); announce('Архив готов'); break;
      case 'dlg-ok': closeDialog(); announce('Работа отправлена на проверку'); break;
      case 'dlg-close': closeDialog(); break;
      default: break;
    }
  });

  document.addEventListener('change', (e) => { if (e.target.id === 'tf') { state.tutorFilter = e.target.value; render(); document.getElementById('tf').focus(); } });
  document.addEventListener('submit', (e) => { e.preventDefault(); state.taskErrors = false; location.hash = 'library'; announce('Задание выдано'); });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'sq') { state.searchQ = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById('sq'); s.focus(); s.setSelectionRange(pos, pos); }
    if (e.target.id === 'task-text' && state.taskErrors && e.target.value.trim()) { e.target.removeAttribute('aria-invalid'); const err = document.getElementById('task-text-err'); if (err) err.remove(); }
    if (e.target.dataset.act === 'draft') { state.draftSaved = false; const st = document.querySelector('.state'); if (st) st.lastChild.textContent = 'Сохраняем…'; clearTimeout(state.dt); state.dt = setTimeout(() => { state.draftSaved = true; const s2 = document.querySelector('.state'); if (s2) s2.lastChild.textContent = 'Черновик сохранён'; }, 900); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'composer' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.querySelector('[data-act="send"]').click(); }
    if (e.key === 'Escape' && state.menuFor) { const id = state.menuFor; state.menuFor = null; render(); const b = document.querySelector('[data-act="menu"][data-v="' + id + '"]'); if (b) b.focus(); }
  });

  function syncPolicy() {
    if (state.policyTouched) return;
    const manual = state.questions.some((q) => !qtypes[q.type][1]);
    state.policy = state.questions.length && !manual ? 'never' : 'after_check';
  }
  let opener = null;
  function openDialog(html) { opener = document.activeElement; const d = document.getElementById('dlg'); d.innerHTML = html; d.showModal(); }
  function closeDialog() { const d = document.getElementById('dlg'); d.close(); if (opener && document.contains(opener)) opener.focus(); }
  function tick() {
    if (state.exportState !== 'building') return;
    state.exportProgress = Math.min(96, state.exportProgress + 7);
    if (route() === 'my-data') {
      const bar = document.querySelector('.progress i'); const st = document.querySelector('.panel .state');
      if (bar) bar.style.width = state.exportProgress + '%';
      if (st) st.lastChild.textContent = 'Собираем архив… файлы ' + Math.round(1270 * state.exportProgress / 100) + ' из 1 270';
    }
    setTimeout(tick, 700);
  }

  window.addEventListener('hashchange', () => render(true));
  render(false);
})();
</script>
</body>
</html>
