version: "2"

run:
  tests: true
  allow-serial-runners: true
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gosec
    - noctx
    - staticcheck
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Setenv|Unsetenv|Environ|ExpandEnv)$
          msg: read settings only through internal/core
        - pattern: ^syscall\.(Getenv|Setenv|Environ)$
          msg: read settings only through internal/core
        - pattern: ^testing\.(T|B|F|TB)\.Setenv$
          msg: tests pass settings through an injected lookup instead
        - pattern: ^time\.Now$
          msg: take time from internal/adapters/clock
        - pattern: ^time\.Sleep$
          msg: wait on an explicit condition with a deadline
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use the structured logger
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: use the structured logger
    depguard:
      rules:
        forbidden:
          files:
            - $all
          deny:
            - pkg: unsafe
              desc: unsafe is forbidden in hand-written code
            - pkg: reflect
              desc: reflect is forbidden in hand-written code
            - pkg: github.com/golang/mock
              desc: mocks are forbidden; write a fake
            - pkg: go.uber.org/mock
              desc: mocks are forbidden; write a fake
            - pkg: github.com/vektra/mockery
              desc: mocks are forbidden; write a fake
            - pkg: github.com/stretchr/testify/mock
              desc: mocks are forbidden; write a fake
            - pkg: github.com/agiledragon/gomonkey
              desc: runtime patching is forbidden
            - pkg: github.com/jarcoal/httpmock
              desc: transport stubbing is forbidden
            - pkg: github.com/aws/aws-sdk-go-v2/config
              desc: the shared AWS configuration reads environment variables and files; build the client from settings
            - pkg: github.com/aws/aws-sdk-go-v2/credentials/
              desc: storage credentials come only from settings; the static provider in the credentials package itself stays allowed
            - pkg: github.com/aws/aws-sdk-go-v2/feature/ec2/imds
              desc: storage credentials come only from settings
        objectstorage:
          files:
            - $all
            - "!**/internal/adapters/**"
          deny:
            - pkg: github.com/aws
              desc: the S3 client belongs to internal/adapters
        images:
          files:
            - $all
            - "!**/internal/services/files/**"
          deny:
            - pkg: golang.org/x/image
              desc: image decoding belongs to internal/services/files
        text:
          files:
            - $all
            - "!**/internal/domain/*.go"
          deny:
            - pkg: golang.org/x/text
              desc: text normalisation belongs to internal/domain
        socketoptions:
          files:
            - $all
            - "!**/internal/adapters/listener/**"
          deny:
            - pkg: golang.org/x/sys
              desc: socket options belong to internal/adapters/listener
        huma:
          files:
            - $all
            - "!**/internal/api/**"
            - "!**/internal/schemas/**"
          deny:
            - pkg: github.com/danielgtaylor/huma
              desc: huma belongs to internal/api and internal/schemas
        pgx:
          files:
            - $all
            - "!**/internal/core/**"
            - "!**/internal/dbgen/**"
            - "!**/internal/repositories/**"
            - "!**/internal/adapters/**"
            - "!**/internal/testdb/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: pgx belongs to core, dbgen, repositories, adapters and testdb
        smtp:
          files:
            - $all
            - "!**/internal/adapters/**"
          deny:
            - pkg: github.com/emersion/go-smtp
              desc: the SMTP client belongs to internal/adapters
            - pkg: github.com/emersion/go-sasl
              desc: SMTP authentication belongs to internal/adapters
        cryptography:
          files:
            - $all
            - "!**/internal/core/**"
          deny:
            - pkg: golang.org/x/crypto
              desc: password hashing and other cryptography belong to internal/core
            - pkg: github.com/golang-jwt/jwt
              desc: access tokens belong to internal/core
        websocket:
          files:
            - $all
            - "!**/internal/realtime/**"
            - "!**/internal/api/*_test.go"
            - "!**/cmd/internal/startup/*_test.go"
          deny:
            - pkg: github.com/coder/websocket
              desc: the WebSocket library belongs to internal/realtime; only API and process tests dial with it
        goose:
          files:
            - $all
            - "!**/cmd/**"
            - "!**/internal/testdb/**"
          deny:
            - pkg: github.com/pressly/goose
              desc: goose belongs to cmd and testdb
  exclusions:
    rules:
      - path: internal/core/settings\.go
        linters:
          - forbidigo
        text: os\.LookupEnv
      - path: internal/adapters/clock/
        linters:
          - forbidigo
        text: time\.Now
      - path: _test\.go
        linters:
          - gosec
        text: G204|G304
      - path: ^internal/core/(settings|storage_settings)\.go$
        linters:
          - gosec
        text: G101
        source: '= "OVC_[A-Z0-9_]+"$'

formatters:
  enable:
    - gofmt
