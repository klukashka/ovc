        if: steps.run.outputs.status != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          retention-days: 3
          if-no-files-found: ignore
      - name: Report the job's result
        env:
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          if [[ "$STATUS" != 0 ]]; then
            echo "run-job exited with status $STATUS" >&2
            exit 1
          fi

