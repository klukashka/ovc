name: gate
run-name: gate ${{ inputs.scope }} ${{ inputs.sha }}${{ inputs.scope == 'evidence' && format(' {0}', inputs.series) || '' }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The candidate commit, one commit on the tip of main
        required: true
        type: string
      scope:
        description: The check list to run
        required: true
        type: choice
        options:
          - full
          - docs
          - change
          - evidence
      jobs:
        description: The change scope's comma-separated CI jobs, with a shard after a colon for a sharded job
        required: false
        type: string
        default: ''
      kind:
        description: The evidence scope's kind of selection
        required: false
        type: choice
        default: none
        options:
          - none
          - go
          - playwright
          - check
      package:
        description: The Go package of a go evidence selection
        required: false
        type: string
        default: ''
      test:
        description: The Go test of a go evidence selection
        required: false
        type: string
        default: ''
      project:
        description: The Playwright project of a playwright evidence selection
        required: false
        type: string
        default: ''
      title:
        description: The Playwright test title of a playwright evidence selection
        required: false
        type: string
        default: ''
      entry:
        description: The gate entry of a check evidence selection, as job:index of merge-gate.sh list --job
        required: false
        type: string
        default: ''
      series:
        description: The evidence series
        required: false
        type: choice
        default: none
        options:
          - none
          - before-first
          - before-rest
          - after

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Record the runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Validate the inputs and the ref
        env:
          CANDIDATE: ${{ inputs.sha }}
          SCOPE: ${{ inputs.scope }}
          JOBS: ${{ inputs.jobs }}
          KIND: ${{ inputs.kind }}
          PACKAGE: ${{ inputs.package }}
          TEST: ${{ inputs.test }}
          PROJECT: ${{ inputs.project }}
          TITLE: ${{ inputs.title }}
          ENTRY: ${{ inputs.entry }}
          SERIES: ${{ inputs.series }}
          REF: ${{ github.ref }}
        run: |
          refuse() {
            echo "$1" >&2
            exit 1
          }
          require_empty() {
            local name
            for name in "$@"; do
              [[ -z "${!name}" ]] || refuse "the input ${name,,} is not used by the $SCOPE selection and must be empty"
            done
          }
          [[ "$REF" == refs/heads/main ]] || refuse "the gate runs only from refs/heads/main"
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || refuse "sha must be a full lower-case commit hash of 40 characters"
          case "$SCOPE" in
            full | docs | change)
              [[ "$KIND" == none && "$SERIES" == none ]] || refuse "kind and series must be none outside the evidence scope"
              require_empty PACKAGE TEST PROJECT TITLE ENTRY
              if [[ "$SCOPE" == change ]]; then
                [[ "${#JOBS}" -le 300 && "$JOBS" =~ ^[a-z][a-z0-9-]*(:[1-9][0-9]?)?(,[a-z][a-z0-9-]*(:[1-9][0-9]?)?)*$ ]] ||
                  refuse "jobs must be a comma-separated list of CI job names of at most 300 characters, with a shard after a colon for a sharded job"
              else
                require_empty JOBS
              fi
              ;;
            evidence)
              require_empty JOBS
              case "$SERIES" in
                before-first | before-rest | after) ;;
                *) refuse "series must be before-first, before-rest or after in the evidence scope" ;;
              esac
              case "$KIND" in
                go)
                  require_empty PROJECT TITLE ENTRY
                  [[ "${#PACKAGE}" -le 200 && "$PACKAGE" =~ ^[A-Za-z0-9_./-]+$ && "$PACKAGE" != -* ]] ||
                    refuse "package must match ^[A-Za-z0-9_./-]+$, must not start with -, and holds at most 200 characters"
                  [[ "${#TEST}" -le 200 && "$TEST" =~ ^Test[A-Za-z0-9_/]+$ && "$TEST" != *//* && "$TEST" != */ ]] ||
                    refuse "test must match ^Test[A-Za-z0-9_/]+$ with no empty subtest name, and holds at most 200 characters"
                  ;;
                playwright)
                  require_empty PACKAGE TEST ENTRY
                  [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$ ]] ||
                    refuse "project must match ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
                  python3 -I -c '
          import os
          import sys
          title = os.environ["TITLE"]
          title_limit = 200
          allowed = set("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ,-:._()/@+?")
          allowed |= set("›’×–…»«“”")
          valid = 0 < len(title) <= title_limit and title[0].isascii() and title[0].isalnum()
          valid = valid and title == title.strip() and set(title) <= allowed
          sys.exit(0 if valid else 1)
          ' || refuse "title must start with a letter or digit, use only the allowed characters and hold at most 200 characters"
                  ;;
                check)
                  require_empty PACKAGE TEST PROJECT TITLE
                  [[ "$ENTRY" =~ ^(backend-checks|frontend-checks|docs-checks):[1-9][0-9]{0,2}$ ]] ||
                    refuse "entry must be backend-checks, frontend-checks or docs-checks, a colon and the entry's line number in merge-gate.sh list --job"
                  ;;
                *) refuse "kind must be go, playwright or check in the evidence scope" ;;
              esac
              ;;
            *) refuse "scope must be full, docs, change or evidence" ;;
          esac
          echo "the inputs of the $SCOPE scope are valid"

  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      candidate: ${{ steps.commits.outputs.candidate }}
      tree: ${{ steps.commits.outputs.tree }}
      main: ${{ steps.commits.outputs.main }}
      scope: ${{ steps.classify.outputs.scope }}
      classification: ${{ steps.classify.outputs.classification }}
      jobs: ${{ steps.matrix.outputs.jobs }}
      backend-tests-shards: ${{ steps.matrix.outputs.backend-tests-shards }}
      e2e-shards: ${{ steps.matrix.outputs.e2e-shards }}
      packages-1: ${{ steps.packages.outputs.packages-1 }}
      packages-2: ${{ steps.packages.outputs.packages-2 }}
      packages-3: ${{ steps.packages.outputs.packages-3 }}
    steps:
      - name: Record the runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Refuse a ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "the gate runs only from refs/heads/main" >&2
            exit 1
          fi
      - name: Check out the harness from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Check that the candidate is one commit on the tip of main
        id: commits
        env:
          CANDIDATE: ${{ inputs.sha }}
          MAIN: ${{ github.sha }}
        run: |
          head="$(git -C candidate rev-parse --verify 'HEAD^{commit}')"
          if [[ "$head" != "$CANDIDATE" ]]; then
            echo "the candidate checkout is at $head, not at the requested commit $CANDIDATE" >&2
            exit 1
          fi
          read -r -a parents <<<"$(git -C candidate rev-list --parents -n 1 HEAD)"
          if [[ "${#parents[@]}" -ne 2 || "${parents[1]}" != "$MAIN" ]]; then
            echo "candidate is not on main's tip: it must be exactly one commit whose only parent is $MAIN" >&2
            exit 1
          fi
          tree="$(git -C candidate rev-parse --verify 'HEAD^{tree}')"
          {
            echo "candidate=$head"
            echo "tree=$tree"
            echo "main=$MAIN"
          } >>"$GITHUB_OUTPUT"
      - name: Classify the candidate
        id: classify
        env:
          SCOPE: ${{ inputs.scope }}
          MAIN: ${{ github.sha }}
        run: |
          classification="$(harness/tools/merge-gate.sh classify --repo "$GITHUB_WORKSPACE/candidate" --base "$MAIN")"
          case "$SCOPE:$classification" in
            full:full | full:docs-only | docs:docs-only | change:full | change:docs-only | evidence:full | evidence:docs-only) ;;
            docs:full)
              echo "the candidate changes more than the Markdown-only list covers; dispatch the full scope" >&2
              exit 1
              ;;
            *)
              echo "unexpected scope $SCOPE or classification $classification" >&2
              exit 1
              ;;
          esac
          {
            echo "scope=$SCOPE"
            echo "classification=$classification"
          } >>"$GITHUB_OUTPUT"
          echo "scope $SCOPE, classification $classification"
      - name: Choose the jobs and shards of the scope from main's table
        id: matrix
        env:
          SCOPE: ${{ steps.classify.outputs.scope }}
          JOBS: ${{ inputs.jobs }}
        run: |
          refuse() {
            echo "$1" >&2
            exit 1
          }
          case "$SCOPE" in
            full | docs) matrix="$(harness/tools/merge-gate.sh ci-matrix --scope "$SCOPE")" ;;
            change) matrix="$(harness/tools/merge-gate.sh ci-matrix --scope change --jobs "$JOBS")" ;;
            evidence) matrix='{"backend-tests":[],"e2e":[],"jobs":[]}' ;;
            *) refuse "unexpected scope $SCOPE" ;;
          esac
          jq -e '
            type == "object"
            and (keys == ["backend-tests", "e2e", "jobs"])
            and (.["backend-tests"] | type == "array" and length == (unique | length) and all(.[]; type == "number" and . == floor and . >= 1 and . <= 3))
            and (.e2e | type == "array" and length == (unique | length) and all(.[]; type == "number" and . == floor and . >= 1 and . <= 12))
            and (.jobs | type == "array" and length == (unique | length) and all(.[]; . == "backend-checks" or . == "frontend-checks" or . == "docs-checks"))
          ' <<<"$matrix" >/dev/null || refuse "merge-gate.sh ci-matrix printed no valid selection: $matrix"
          backend_tests="$(jq -c '.["backend-tests"]' <<<"$matrix")"
          e2e="$(jq -c '.e2e' <<<"$matrix")"
          jobs="$(jq -c '.jobs' <<<"$matrix")"
          case "$SCOPE" in
            full)
              [[ "$backend_tests" != '[]' && "$e2e" != '[]' && "$jobs" != *docs-checks* ]] ||
                refuse "the full scope must select every backend-tests and e2e shard and no docs-checks: $matrix"
              ;;
            docs)
              [[ "$backend_tests" == '[]' && "$e2e" == '[]' && "$jobs" == '["docs-checks"]' ]] ||
                refuse "the docs scope must select docs-checks only: $matrix"
              ;;
            change)
              [[ "$backend_tests" != '[]' || "$e2e" != '[]' || "$jobs" != '[]' ]] ||
                refuse "the change scope selected no job: $matrix"
              ;;
          esac
          {
            echo "backend-tests-shards=$backend_tests"
            echo "e2e-shards=$e2e"
            echo "jobs=$jobs"
          } >>"$GITHUB_OUTPUT"
          echo "scope $SCOPE: backend-tests shards $backend_tests, e2e shards $e2e, jobs $jobs"
      - name: Set up Go from the candidate's tools/go.mod
        if: steps.matrix.outputs.backend-tests-shards != '[]'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: candidate/tools/go.mod
          cache: false
      - name: Assign the backend packages to the test shards
        if: steps.matrix.outputs.backend-tests-shards != '[]'
        id: packages
        working-directory: candidate/backend
        env:
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: |
          module="$(go list -m)"
          go list ./... | LC_ALL=C sort >"$RUNNER_TEMP/packages"
          if [[ "$(LC_ALL=C sort -u "$RUNNER_TEMP/packages" | wc -l)" -ne "$(wc -l <"$RUNNER_TEMP/packages")" ]]; then
            echo "go list ./... printed a package twice" >&2
            exit 1
          fi
          awk -v api="$module/internal/api" -v folder="$RUNNER_TEMP" '
            $0 == api { print > (folder "/shard-1"); found = 1; next }
            { print > (folder "/shard-" (2 + index_count % 2)); index_count++ }
            END { if (!found) { print "go list ./... does not list " api > "/dev/stderr"; exit 1 } }
          ' "$RUNNER_TEMP/packages"
          for shard in 1 2 3; do
            touch "$RUNNER_TEMP/shard-$shard"
            if [[ ! -s "$RUNNER_TEMP/shard-$shard" ]]; then
              echo "shard $shard has no packages" >&2
              exit 1
            fi
          done
          if ! cat "$RUNNER_TEMP"/shard-1 "$RUNNER_TEMP"/shard-2 "$RUNNER_TEMP"/shard-3 | LC_ALL=C sort | cmp -s - "$RUNNER_TEMP/packages"; then
            echo "the shard assignment does not cover go list ./... exactly once" >&2
            exit 1
          fi
          for shard in 1 2 3; do
            echo "packages-$shard=$(paste -s -d ' ' "$RUNNER_TEMP/shard-$shard")" >>"$GITHUB_OUTPUT"
            echo "shard $shard: $(paste -s -d ' ' "$RUNNER_TEMP/shard-$shard")"
          done

  backend-tests:
    needs: prepare
    if: needs.prepare.outputs.backend-tests-shards != '' && needs.prepare.outputs.backend-tests-shards != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.backend-tests-shards) }}
    steps:
      - name: Record the runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Refuse a ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "the gate runs only from refs/heads/main" >&2
            exit 1
          fi
      - name: Check out the harness from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Confirm the candidate commit
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          if [[ "$(git -C candidate rev-parse --verify 'HEAD^{commit}')" != "$CANDIDATE" ]]; then
            echo "the candidate checkout is not at $CANDIDATE" >&2
            exit 1
          fi
      - name: Set up Go from the candidate's tools/go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: candidate/tools/go.mod
          cache: false
      - name: Build the pinned tools into bin/
        working-directory: candidate
        run: |
          toolchain="$(awk '$1 == "toolchain" { print $2 }' tools/go.mod)"
          GOTOOLCHAIN="$toolchain" go -C tools build -o ../bin/ github.com/golangci/golangci-lint/v2/cmd/golangci-lint golang.org/x/vuln/cmd/govulncheck github.com/zricethezav/gitleaks/v8 github.com/google/osv-scanner/v2/cmd/osv-scanner github.com/sqlc-dev/sqlc/cmd/sqlc
      - name: Generate the throwaway settings
        run: harness/tools/ci-settings.sh "$GITHUB_WORKSPACE/candidate"
      - name: Start the Compose services
        working-directory: candidate
        run: docker compose up --wait
      - name: Write the shard's package list
        env:
          SHARD: ${{ matrix.shard }}
          PACKAGES_1: ${{ needs.prepare.outputs.packages-1 }}
          PACKAGES_2: ${{ needs.prepare.outputs.packages-2 }}
          PACKAGES_3: ${{ needs.prepare.outputs.packages-3 }}
        run: |
          name="PACKAGES_$SHARD"
          read -r -a packages <<<"${!name}"
          printf '%s\n' "${packages[@]}" >"$RUNNER_TEMP/shard-packages"
          echo "shard $SHARD packages: ${packages[*]}"
      - name: Run the job's entries
        id: run
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          status=0
          env -u GOTOOLCHAIN harness/tools/merge-gate.sh run-job backend-tests --shard "$SHARD/3" --repo "$GITHUB_WORKSPACE/candidate" --packages "$RUNNER_TEMP/shard-packages" 2>&1 | tee "$RUNNER_TEMP/run-job.log" || status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            tail -n 40 "$RUNNER_TEMP/run-job.log" >"$RUNNER_TEMP/evidence/log-tail.txt"
            read -r -a generated <<<"${CI_GENERATED_SETTING_NAMES:-}"
            for name in "${generated[@]}"; do
              if [[ ! "$name" =~ ^OVC_[A-Z0-9_]+$ ]]; then
                generated=()
                break
              fi
            done
            if [[ ${#generated[@]} -eq 0 ]]; then
              rm -rf "$RUNNER_TEMP/evidence"
              echo "CI_GENERATED_SETTING_NAMES lists no usable setting names, so no evidence is uploaded" >&2
              exit 1
            fi
            for file in "$RUNNER_TEMP"/evidence/*; do
              content="$(<"$file")"
              for name in "${generated[@]}"; do
                if [[ -n "${!name:-}" ]]; then
                  content="${content//"${!name}"/[redacted]}"
                fi
              done
              printf '%s\n' "$content" >"$file"
            done
          fi
      - name: Upload the redacted evidence
        if: steps.run.outputs.status != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-backend-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          retention-days: 3
          if-no-files-found: ignore
      - name: Report the job's result
        env:
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          if [[ "$STATUS" != 0 ]]; then
            echo "run-job exited with status $STATUS" >&2
            exit 1
          fi

  backend-checks:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.jobs), 'backend-checks')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Record the runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Refuse a ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "the gate runs only from refs/heads/main" >&2
            exit 1
          fi
      - name: Check out the harness from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out the candidate with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the candidate commit
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          if [[ "$(git -C candidate rev-parse --verify 'HEAD^{commit}')" != "$CANDIDATE" ]]; then
            echo "the candidate checkout is not at $CANDIDATE" >&2
            exit 1
          fi
      - name: Set up Go from the candidate's tools/go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: candidate/tools/go.mod
          cache: false
      - name: Set up Node from the candidate's frontend/.node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: candidate/frontend/.node-version
          package-manager-cache: false
      - name: Install pnpm through the pinned corepack
        run: |
          read -r algorithm digest url < <(awk '$1 == "corepack" { print $2, $3, $4 }' harness/tools/ci-tools.sha256)
          if [[ "$algorithm" != sha512 || "$url" != https://* ]]; then
            echo "tools/ci-tools.sha256 holds no usable corepack line" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/corepack.tgz" "$url"
          if [[ "$(sha512sum "$RUNNER_TEMP/corepack.tgz" | awk '{ print $1 }')" != "$digest" ]]; then
            echo "the corepack tarball does not match tools/ci-tools.sha256" >&2
            exit 1
          fi
          npm install --global --ignore-scripts "$RUNNER_TEMP/corepack.tgz"
          corepack enable
          package_manager="$(jq -r '.packageManager // empty' candidate/frontend/package.json)"
          if [[ ! "$package_manager" =~ ^pnpm@[0-9]+[.][0-9]+[.][0-9]+[+]sha512[.][0-9a-f]{128}$ ]]; then
            echo "candidate/frontend/package.json names no packageManager of the form pnpm@<version>+sha512.<hex>" >&2
            exit 1
          fi
          corepack install --global "$package_manager"
          pnpm --dir candidate/frontend --version
      - name: Build the pinned tools into bin/
        working-directory: candidate
        run: |
          toolchain="$(awk '$1 == "toolchain" { print $2 }' tools/go.mod)"
          GOTOOLCHAIN="$toolchain" go -C tools build -o ../bin/ github.com/golangci/golangci-lint/v2/cmd/golangci-lint golang.org/x/vuln/cmd/govulncheck github.com/zricethezav/gitleaks/v8 github.com/google/osv-scanner/v2/cmd/osv-scanner github.com/sqlc-dev/sqlc/cmd/sqlc
      - name: Run the job's entries
        id: run
        env:
          MAIN: ${{ needs.prepare.outputs.main }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          status=0
          env -u GOTOOLCHAIN harness/tools/merge-gate.sh run-job backend-checks --repo "$GITHUB_WORKSPACE/candidate" --base "$MAIN" 2>&1 | tee "$RUNNER_TEMP/run-job.log" || status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            tail -n 40 "$RUNNER_TEMP/run-job.log" >"$RUNNER_TEMP/evidence/log-tail.txt"
          fi
      - name: Upload the redacted evidence
        if: steps.run.outputs.status != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-backend-checks
          path: ${{ runner.temp }}/evidence
          retention-days: 3
          if-no-files-found: ignore
      - name: Report the job's result
        env:
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          if [[ "$STATUS" != 0 ]]; then
            echo "run-job exited with status $STATUS" >&2
            exit 1
          fi

  frontend-checks:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.jobs), 'frontend-checks')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Record the runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Refuse a ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "the gate runs only from refs/heads/main" >&2
            exit 1
          fi
      - name: Check out the harness from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Confirm the candidate commit
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          if [[ "$(git -C candidate rev-parse --verify 'HEAD^{commit}')" != "$CANDIDATE" ]]; then
            echo "the candidate checkout is not at $CANDIDATE" >&2
            exit 1
          fi
      - name: Set up Go from the candidate's tools/go.mod
