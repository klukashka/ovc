    needs: prepare
    if: needs.prepare.outputs.e2e-shards != '' && needs.prepare.outputs.e2e-shards != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.e2e-shards) }}
    steps:
      - name: Record the runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Refuse a ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo "the gate runs only from refs/heads/main" >&2
            exit 1
          fi
      - name: Check out the harness from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Confirm the candidate commit
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          if [[ "$(git -C candidate rev-parse --verify 'HEAD^{commit}')" != "$CANDIDATE" ]]; then
            echo "the candidate checkout is not at $CANDIDATE" >&2
            exit 1
          fi
      - name: Set up Go from the candidate's tools/go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: candidate/tools/go.mod
          cache: false
      - name: Set up Node from the candidate's frontend/.node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: candidate/frontend/.node-version
          package-manager-cache: false
      - name: Install pnpm through the pinned corepack
        run: |
          read -r algorithm digest url < <(awk '$1 == "corepack" { print $2, $3, $4 }' harness/tools/ci-tools.sha256)
          if [[ "$algorithm" != sha512 || "$url" != https://* ]]; then
            echo "tools/ci-tools.sha256 holds no usable corepack line" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/corepack.tgz" "$url"
          if [[ "$(sha512sum "$RUNNER_TEMP/corepack.tgz" | awk '{ print $1 }')" != "$digest" ]]; then
            echo "the corepack tarball does not match tools/ci-tools.sha256" >&2
            exit 1
          fi
          npm install --global --ignore-scripts "$RUNNER_TEMP/corepack.tgz"
          corepack enable
          package_manager="$(jq -r '.packageManager // empty' candidate/frontend/package.json)"
          if [[ ! "$package_manager" =~ ^pnpm@[0-9]+[.][0-9]+[.][0-9]+[+]sha512[.][0-9a-f]{128}$ ]]; then
            echo "candidate/frontend/package.json names no packageManager of the form pnpm@<version>+sha512.<hex>" >&2
            exit 1
          fi
          corepack install --global "$package_manager"
          pnpm --dir candidate/frontend --version
      - name: Install the frontend dependencies and the Playwright browsers
        run: |
          pnpm --dir candidate/frontend install --frozen-lockfile
          pnpm --dir candidate/frontend exec playwright install --with-deps
      - name: Generate the throwaway settings
        run: harness/tools/ci-settings.sh "$GITHUB_WORKSPACE/candidate"
      - name: Start the Compose services
        working-directory: candidate
        run: docker compose up --wait
      - name: Run the job's entries
        id: run
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          status=0
          env -u GOTOOLCHAIN harness/tools/merge-gate.sh run-job e2e --shard "$SHARD/12" --repo "$GITHUB_WORKSPACE/candidate" 2>&1 | tee "$RUNNER_TEMP/run-job.log" || status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            tail -n 40 "$RUNNER_TEMP/run-job.log" >"$RUNNER_TEMP/evidence/log-tail.txt"
            count=0
            while IFS= read -r -d '' diagnostics; do
              count=$((count + 1))
              cp "$diagnostics" "$RUNNER_TEMP/evidence/browser-diagnostics-$count.json"
            done < <(find candidate/frontend/test-results/playwright -type f -name browser-diagnostics.json -print0 2>/dev/null)
            read -r -a generated <<<"${CI_GENERATED_SETTING_NAMES:-}"
            for name in "${generated[@]}"; do
              if [[ ! "$name" =~ ^OVC_[A-Z0-9_]+$ ]]; then
                generated=()
                break
              fi
            done
            if [[ ${#generated[@]} -eq 0 ]]; then
              rm -rf "$RUNNER_TEMP/evidence"
              echo "CI_GENERATED_SETTING_NAMES lists no usable setting names, so no evidence is uploaded" >&2
              exit 1
            fi
            for file in "$RUNNER_TEMP"/evidence/*; do
              content="$(<"$file")"
              for name in "${generated[@]}"; do
                if [[ -n "${!name:-}" ]]; then
                  content="${content//"${!name}"/[redacted]}"
                fi
              done
              printf '%s\n' "$content" >"$file"
            done
          fi
