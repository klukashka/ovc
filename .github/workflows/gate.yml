            content="$(<"$file")"
            for name in ${generated[@]+"${generated[@]}"}; do
              [[ "$name" =~ ^OVC_[A-Z0-9_]+$ ]] || refuse "CI_GENERATED_SETTING_NAMES holds the unusable name $name"
              if [[ -n "${!name:-}" ]]; then
                content="${content//"${!name}"/[redacted]}"
              fi
            done
            printf '%s\n' "$content" >"$file"
          }
          case "$SERIES" in
            before-first) runs=1 ;;
            before-rest) runs=9 ;;
            after) runs=10 ;;
            *) refuse "series must be before-first, before-rest or after" ;;
          esac
          arguments=()
          case "$KIND" in
            go)
              gate_entry backend-tests
              [[ "$entry_command" == *" go test "* && "$entry_command" == *" -count=1 "* && "$entry_command" == *" ./..." ]] ||
                refuse "the backend-tests entry of main's gate is not a go test with -count=1 over ./..."
              entry_command="${entry_command% ./...}"
              (cd "candidate/$entry_directory" && env -u GOTOOLCHAIN go list ./...) >"$RUNNER_TEMP/packages"
              grep -qxF -- "$PACKAGE" "$RUNNER_TEMP/packages" || refuse "the package $PACKAGE is not listed by go list ./... in the candidate"
              IFS='/' read -r -a test_levels <<<"$TEST"
              run_pattern=""
              for level in "${test_levels[@]}"; do
                run_pattern="$run_pattern${run_pattern:+/}^$level\$"
              done
              arguments=(-v -run "$run_pattern" "$PACKAGE")
              record_pattern='^[[:space:]]*--- (PASS|FAIL|SKIP): |^(ok|FAIL)[[:space:]]|^testing: warning: no tests to run'
              test_pattern="^[[:space:]]*--- (PASS|FAIL): $TEST \\("
              ;;
            playwright)
              gate_entry e2e
              [[ "$entry_command" == *" pnpm e2e "* && "$entry_command" == *" --trace=off"* ]] ||
                refuse "the e2e entry of main's gate is not pnpm e2e with --trace=off"
              (cd "candidate/$entry_directory" && pnpm exec playwright test --list --reporter=json) >"$RUNNER_TEMP/playwright-list.json"
              python3 -I -c '
          import json
          import sys
          report = json.load(sys.stdin)
          for project in report["config"]["projects"]:
              print(project["name"])
          ' <"$RUNNER_TEMP/playwright-list.json" >"$RUNNER_TEMP/projects" || refuse "the Playwright list of the candidate names no projects"
              grep -qxF -- "$PROJECT" "$RUNNER_TEMP/projects" || refuse "the project $PROJECT is not a Playwright project of the candidate"
              title_pattern="$(python3 -I -c '
          import os
          import re
          print(re.sub(r"([\\^$.*+?()\[\]{}|/])", r"\\\1", os.environ["TITLE"]))
          ')"
              project_pattern="${PROJECT//./[.]}"
              arguments=(--workers=1 --retries=0 --project "$PROJECT" -g "(^| )$title_pattern( @[^ ]+)*\$" --reporter=list)
              record_pattern="^[[:space:]]*[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)|No tests found|\\[$project_pattern\\] › "
              test_pattern="\\[$project_pattern\\] › "
              ;;
            check)
              entry_job="${ENTRY%%:*}"
              entry_index="${ENTRY#*:}"
              harness/tools/merge-gate.sh list --job "$entry_job" >"$RUNNER_TEMP/entries"
              entry_count="$(wc -l <"$RUNNER_TEMP/entries" | tr -d ' ')"
              [[ "$entry_index" -le "$entry_count" ]] || refuse "the $entry_job job of main's gate holds $entry_count entries, not $entry_index"
              entry_line="$(sed -n "${entry_index}p" "$RUNNER_TEMP/entries")"
              echo "entry $ENTRY: $entry_line"
              arguments=(run-job "$entry_job" --entry "$entry_index" --repo "$GITHUB_WORKSPACE/candidate")
              if [[ "$(cut -d '|' -f 2 <<<"$entry_line")" == history-range ]]; then
                arguments+=(--base "$MAIN")
              fi
              record_pattern=''
              test_pattern=''
              ;;
            *) refuse "kind must be go, playwright or check" ;;
          esac
          title_sha256=""
          if [[ -n "$TITLE" ]]; then
            title_sha256="$(printf '%s' "$TITLE" | sha256sum | cut -d ' ' -f 1)"
          fi
          echo "evidence selection: kind:$KIND|package:$PACKAGE|test:$TEST|project:$PROJECT|title-sha256:$title_sha256|entry:$ENTRY"
          echo "evidence series $SERIES of candidate $CANDIDATE: $runs runs of the $KIND selection"
          passed=0
          failed=0
          no_test=0
          run=1
          while [[ "$run" -le "$runs" ]]; do
            output="$RUNNER_TEMP/evidence-run-$run.log"
            status=0
            case "$KIND" in
              go | playwright)
                (cd "candidate/$entry_directory" && exec env -u GOTOOLCHAIN bash -c "$entry_command \"\$@\"" evidence "${arguments[@]}") </dev/null >"$output" 2>&1 || status=$?
                ;;
              check)
                env -u GOTOOLCHAIN harness/tools/merge-gate.sh "${arguments[@]}" </dev/null >"$output" 2>&1 || status=$?
                ;;
            esac
            redact "$output"
            token="$(openssl rand -hex 16)"
            echo "evidence run $run/$runs nonce: $token"
            echo "::group::evidence run $run/$runs output"
            echo "::stop-commands::$token"
            cat "$output"
            echo "::$token::"
            echo "::endgroup::"
            echo "::stop-commands::$token"
            echo "evidence run $run/$runs recorded lines:"
            if [[ -n "$record_pattern" ]]; then
              grep -E -- "$record_pattern" "$output" || true
            else
              tail -n 20 "$output"
            fi
            echo "::$token::"
            if [[ -n "$test_pattern" ]] && ! grep -qE -- "$test_pattern" "$output"; then
              no_test=$((no_test + 1))
              echo "evidence result: run=$run/$runs outcome=no-test nonce=$token"
            elif [[ "$status" -eq 0 ]]; then
              passed=$((passed + 1))
              echo "evidence result: run=$run/$runs outcome=passed nonce=$token"
            else
              failed=$((failed + 1))
              echo "evidence result: run=$run/$runs outcome=failed nonce=$token"
            fi
            run=$((run + 1))
          done
          echo "evidence series $SERIES: $runs runs, $passed passed, $failed failed, $no_test ran no test"
          if [[ "$failed" -ne 0 || "$no_test" -ne 0 ]]; then
            exit 1
          fi

  gate:
    needs: [validate, prepare, backend-tests, backend-checks, frontend-checks, e2e, docs-checks, evidence]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    timeout-minutes: 5
    steps:
      - name: Require every job of the selection to succeed and post the commit status of a gate scope
        env:
          NEEDS: ${{ toJSON(needs) }}
          JOBS: ${{ needs.prepare.outputs.jobs }}
          BACKEND_TESTS_SHARDS: ${{ needs.prepare.outputs.backend-tests-shards }}
          E2E_SHARDS: ${{ needs.prepare.outputs.e2e-shards }}
          SCOPE: ${{ needs.prepare.outputs.scope }}
          CLASSIFICATION: ${{ needs.prepare.outputs.classification }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          TREE: ${{ needs.prepare.outputs.tree }}
          MAIN: ${{ needs.prepare.outputs.main }}
          PACKAGES_1: ${{ needs.prepare.outputs.packages-1 }}
          PACKAGES_2: ${{ needs.prepare.outputs.packages-2 }}
          PACKAGES_3: ${{ needs.prepare.outputs.packages-3 }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          verdict=success
          problems=()
          required=" validate prepare "
          case "$SCOPE" in
            evidence) required="$required""evidence " ;;
            full | docs | change)
              if selected="$(jq -r 'if type == "array" then .[] else error("not an array") end' <<<"${JOBS:-null}" 2>/dev/null)"; then
                for job in $selected; do
                  required="$required$job "
                done
              else
                verdict=failure
                problems+=("prepare produced no job list")
              fi
              if [[ "$BACKEND_TESTS_SHARDS" != '[]' ]]; then
                required="$required""backend-tests "
              fi
              if [[ "$E2E_SHARDS" != '[]' ]]; then
                required="$required""e2e "
              fi
              ;;
            *)
              verdict=failure
              problems+=("prepare named no scope")
              ;;
          esac
          if [[ "$required" == " validate prepare " ]]; then
            verdict=failure
            problems+=("prepare selected no job")
          fi
          while read -r job result; do
            if [[ "$required" == *" $job "* ]]; then
              if [[ "$result" != success ]]; then
                verdict=failure
                problems+=("$job: $result")
              fi
            elif [[ "$result" != skipped ]]; then
              verdict=failure
              problems+=("$job ran outside the selection: $result")
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          for job in $required; do
            if ! jq -e --arg job "$job" 'has($job)' <<<"$NEEDS" >/dev/null; then
              verdict=failure
              problems+=("$job is not a dependency of the gate job")
            fi
          done
          {
            echo "## gate ${SCOPE:-unknown}: $verdict"
            echo
            echo "- candidate C: ${CANDIDATE:-unknown}"
            echo "- tree T: ${TREE:-unknown}"
            echo "- main M: ${MAIN:-unknown}"
            echo "- classification: ${CLASSIFICATION:-unknown}"
            echo "- required jobs:${required}"
            echo "- backend-tests shards: ${BACKEND_TESTS_SHARDS:-none}"
            echo "- e2e shards: ${E2E_SHARDS:-none}"
            echo "- backend-tests shard 1: ${PACKAGES_1:-none}"
            echo "- backend-tests shard 2: ${PACKAGES_2:-none}"
            echo "- backend-tests shard 3: ${PACKAGES_3:-none}"
            for problem in ${problems[@]+"${problems[@]}"}; do
              echo "- problem: $problem"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          for problem in ${problems[@]+"${problems[@]}"}; do
            echo "gate: $problem" >&2
          done
          if [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ && ( "$SCOPE" == full || "$SCOPE" == docs ) ]]; then
            gh api --method POST "repos/$REPOSITORY/statuses/$CANDIDATE" -f state="$verdict" -f context=ovc-gate -f target_url="$RUN_URL" -f description="gate $SCOPE" >/dev/null
          fi
          if [[ "$verdict" != success ]]; then
            exit 1
          fi
          echo "gate $SCOPE passed for $CANDIDATE"
